<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DF Live Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Russo+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@property --hue{syntax:"<number>";inherits:true;initial-value:0}
@property --rot{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  --metal1:#3b4146;--metal2:#1d2125;--metal3:#565e65;--inset:rgba(8,10,12,.92);
  --text:#c9ced2;--dim:#7d868d;
  --acc:hsl(calc(28 + var(--hue)) 45% 48%);          /* oranye redup (goggle) -> merah -> teal redup */
  --acc2:hsl(calc(180 + var(--hue)*.4) 30% 42%);
  --glow:hsl(calc(28 + var(--hue)) 50% 45% / .5);
  animation:hue 12s ease-in-out infinite}
@keyframes hue{0%,100%{--hue:0}33%{--hue:-22}66%{--hue:150}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;font-family:Rajdhani,sans-serif;color:var(--text)}
html:has(body.bg){background:linear-gradient(#2b3a33 0 40%,#000 40%)}
.mono{font-family:"Share Tech Mono",monospace}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}

/* ---------- frame metalik ---------- */
.frame{position:absolute;background:linear-gradient(180deg,var(--metal3),var(--metal1) 12%,var(--metal2) 60%,#121417);
  clip-path:polygon(0 18px,18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px));overflow:hidden}
.frame::after{content:"";position:absolute;top:0;bottom:0;width:180px;left:-200px;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,40%{left:-200px}100%{left:110%}}
.frame .inner{position:absolute;inset:10px;background:var(--inset);
  clip-path:polygon(0 12px,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px))}
.frame .edge{position:absolute;left:0;right:0;height:3px;top:10px;background:linear-gradient(90deg,transparent,var(--acc),transparent);
  background-size:40% 100%;background-repeat:no-repeat;animation:run 5s linear infinite;opacity:.8}
.frame .edge.b{top:auto;bottom:10px;animation-direction:reverse}
@keyframes run{from{background-position:-60% 0}to{background-position:160% 0}}
.slash{position:absolute;display:flex;gap:7px}
.slash i{width:10px;height:26px;background:var(--metal3);transform:skewX(-30deg);animation:sl 2s infinite}
.slash i:nth-child(2){animation-delay:.2s}.slash i:nth-child(3){animation-delay:.4s}.slash i:nth-child(4){animation-delay:.6s}
@keyframes sl{0%,100%{background:var(--metal3)}30%{background:var(--acc)}}

/* ---------- panel ---------- */
.panel{position:absolute;background:linear-gradient(180deg,#2a3035,#16191c);padding:6px;
  clip-path:polygon(0 14px,14px 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.panel::before{content:"";position:absolute;inset:0;padding:2px;
  background:conic-gradient(from var(--rot),transparent 0 70%,var(--acc) 88%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite}
@keyframes spin{to{--rot:360deg}}
.ptitle{background:linear-gradient(180deg,#5a6268,#2c3135);color:#e1e4e6;font:700 22px Rajdhani;letter-spacing:3px;text-align:center;padding:3px 0;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 100%,0 100%)}
.pbody{background:var(--inset);height:calc(100% - 34px);margin-top:4px;position:relative;overflow:hidden}

/* QR */
.qrp .pbody{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.qslot{position:relative;padding:7px;background:#aab1b6}
.qslot .laser{position:absolute;left:-4px;right:-4px;height:3px;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:laser 2s ease-in-out infinite alternate}
@keyframes laser{from{top:3%}to{top:95%}}
.qph{display:grid;place-items:center;text-align:center;color:#2b3034;font:700 16px "Share Tech Mono",monospace;background:#8e969b;line-height:1.3}
.qcap{font-size:17px;letter-spacing:2px;color:var(--dim)}
.qcap b{color:var(--acc)}

/* TOP GLOBAL */
.lb .pbody{padding:6px 12px}
.row{display:flex;align-items:center;gap:8px;font-size:18px;height:24px;border-bottom:1px solid rgba(255,255,255,.05);opacity:0;animation:rin 10s infinite}
@keyframes rin{0%{opacity:0;transform:translateX(30px)}4%,94%{opacity:1;transform:none}100%{opacity:0}}
.row .r{width:24px;color:var(--dim);font-family:"Share Tech Mono"}
.row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.row .v{font-family:"Share Tech Mono";color:#aeb5ba}
.row.top1 .r,.row.top1 .v{color:#c9a45c}.row.top1 .n{color:#e3d2a8;text-shadow:0 0 8px rgba(201,164,92,.5)}
.row.top2 .r{color:#a9b2b8}.row.top3 .r{color:#a67650}

/* LOGO */
.logo{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo .big{white-space:nowrap;font-family:"Russo One",sans-serif;letter-spacing:4px;line-height:1;font-style:italic;position:relative;
  background:linear-gradient(100deg,#6b737a 0%,#b9c0c5 30%,#6b737a 45%,#8c949a 60%,#4e555b 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:mshine 5s linear infinite;
  filter:drop-shadow(0 3px 0 #0b0d0f) drop-shadow(0 0 14px var(--glow))}
@keyframes mshine{from{background-position:120% 0}to{background-position:-130% 0}}
.logo .big::after{content:attr(data-t);position:absolute;inset:0;color:var(--acc);-webkit-text-fill-color:var(--acc);opacity:0;animation:gl 5s infinite steps(1)}
@keyframes gl{0%,90%,100%{opacity:0;transform:none}91%{opacity:.6;transform:translate(-5px,2px);clip-path:inset(0 0 55% 0)}94%{opacity:.6;transform:translate(5px,0);clip-path:inset(60% 0 0 0)}}
.logo .sub{display:flex;align-items:center;gap:14px;letter-spacing:8px;color:var(--dim);margin-top:8px}
.logo .sub::before,.logo .sub::after{content:"";width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--acc))}
.logo .sub::after{transform:scaleX(-1)}
.live{display:inline-flex;align-items:center;gap:8px;background:#8f2f2f;color:#eadada;font-weight:700;letter-spacing:3px;padding:2px 12px;margin-bottom:10px;font-size:20px}
.live i{width:9px;height:9px;border-radius:50%;background:#eadada;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}

/* CHIBI */
.chibi{position:absolute;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(0,0,0,.7))}
@keyframes bob{50%{transform:translateY(-8px)}}
.chibi .head{animation:tilt 4.8s ease-in-out infinite;transform-origin:150px 230px}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
.chibi .lens{animation:lens 1.6s ease-in-out infinite}
.chibi .lens:nth-of-type(2){animation-delay:.4s}.chibi .lens:nth-of-type(3){animation-delay:.8s}.chibi .lens:nth-of-type(4){animation-delay:1.2s}
@keyframes lens{0%,100%{opacity:.35}50%{opacity:1}}
.chibi .dev{animation:lens 2s ease-in-out infinite}
.chibi .glint{animation:glint 4s ease-in-out infinite}
@keyframes glint{0%,60%{transform:translateX(-90px);opacity:0}70%{opacity:.7}100%{transform:translateX(110px);opacity:0}}
.chibi .gun{animation:gun 2.4s ease-in-out infinite;transform-origin:150px 300px}
@keyframes gun{50%{transform:rotate(-3deg)}}

.dust{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--acc);opacity:0;animation:float linear infinite}
@keyframes float{0%{opacity:0;transform:translateY(0)}20%{opacity:.6}100%{opacity:0;transform:translateY(-140px)}}

/* ================= layout STRIP (portrait, 1440x480) ================= */
.strip #stage{width:1440px;height:480px}
.strip .frame{left:0;top:150px;width:1440px;height:330px}
.strip .chibi{left:-6px;top:0;width:330px;height:480px}
.strip .logo{left:330px;top:160px;width:600px;height:310px}
.strip .logo .big{font-size:70px}
.strip .logo .sub{font-size:20px}
.strip .qrp{left:930px;top:110px;width:220px;height:350px}
.strip .lb{left:1162px;top:110px;width:266px;height:350px}
.strip .slash.s1{left:350px;top:425px}.strip .slash.s2{left:860px;top:425px}

/* ================= layout WIDE (landscape, 1920x400) ================= */
.wide #stage{width:1920px;height:400px}
.wide .frame{left:0;top:120px;width:1920px;height:280px}
.wide .chibi{left:10px;top:0;width:290px;height:420px}
.wide .logo{left:320px;top:130px;width:880px;height:260px}
.wide .logo .big{font-size:96px}
.wide .logo .sub{font-size:22px}
.wide .qrp{left:1230px;top:80px;width:240px;height:300px}
.wide .lb{left:1490px;top:80px;width:410px;height:300px}
.wide .slash.s1{left:340px;top:350px}.wide .slash.s2{left:1130px;top:350px}
</style></head>
<body>
<div id="stage">
  <div class="frame"><div class="inner"></div><div class="edge"></div><div class="edge b"></div></div>
  <div class="slash s1"><i></i><i></i><i></i><i></i></div>
  <div class="slash s2"><i></i><i></i><i></i><i></i></div>

  <div class="logo">
    <div class="live"><i></i>LIVE</div>
    <div class="big" id="name" data-t="DELTA FORCE">DELTA FORCE</div>
    <div class="sub mono" id="sub">HAZARD OPS</div>
  </div>

  <div class="panel qrp">
    <div class="ptitle">SCAN ME!</div>
    <div class="pbody"><div class="qslot"><div id="qr"></div><div class="laser"></div></div><div class="qcap mono">SUPPORT &amp; <b>SAWER</b></div></div>
  </div>

  <div class="panel lb">
    <div class="ptitle">TOP GLOBAL</div>
    <div class="pbody" id="lb"></div>
  </div>

  <!-- Chibi Vyron (fan art) -->
  <svg class="chibi" viewBox="0 0 300 460" preserveAspectRatio="xMidYMax meet">
    <defs>
      <linearGradient id="tan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a8a68"/><stop offset="1" stop-color="#6c5f45"/></linearGradient>
      <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34405a"/><stop offset="1" stop-color="#1f2638"/></linearGradient>
      <linearGradient id="gog" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e08a4a"/><stop offset=".55" stop-color="#b8462c"/><stop offset="1" stop-color="#5e1f16"/></linearGradient>
      <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7176"/><stop offset="1" stop-color="#3a3f43"/></linearGradient>
      <linearGradient id="gunm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5055"/><stop offset="1" stop-color="#25292c"/></linearGradient>
      <clipPath id="gclip"><path d="M70 172 Q150 150 230 172 L222 212 Q150 226 78 212 Z"/></clipPath>
    </defs>
    <ellipse cx="150" cy="452" rx="80" ry="8" fill="rgba(0,0,0,.5)"/>
    <!-- legs -->
    <path d="M102 368 L144 368 L140 432 L106 432 Z" fill="#2c3240"/>
    <path d="M156 368 L198 368 L194 432 L160 432 Z" fill="#2c3240"/>
    <rect x="104" y="392" width="38" height="22" rx="8" fill="#16191d"/><rect x="158" y="392" width="38" height="22" rx="8" fill="#16191d"/>
    <path d="M96 430 L146 430 L148 448 L94 448 Z" fill="#5e5340"/><path d="M154 430 L204 430 L206 448 L152 448 Z" fill="#5e5340"/>
    <rect x="94" y="444" width="54" height="6" rx="2" fill="#1a1c1e"/><rect x="152" y="444" width="54" height="6" rx="2" fill="#1a1c1e"/>
    <!-- torso shirt -->
    <path d="M88 262 Q150 238 212 262 L208 372 L92 372 Z" fill="url(#navy)"/>
    <!-- belt -->
    <rect x="92" y="356" width="116" height="16" rx="3" fill="#3a3528"/><rect x="140" y="354" width="22" height="20" rx="3" fill="#7c7f82"/>
    <!-- plate carrier -->
    <path d="M98 262 L202 262 L206 352 L94 352 Z" fill="url(#tan)" stroke="#4e4532" stroke-width="2"/>
    <g stroke="#4e4532" stroke-width="2">
      <rect x="102" y="310" width="30" height="40" rx="4" fill="#857659"/>
      <rect x="135" y="310" width="30" height="40" rx="4" fill="#857659"/>
      <rect x="168" y="310" width="30" height="40" rx="4" fill="#857659"/>
    </g>
    <rect x="106" y="304" width="22" height="10" rx="3" fill="#6a5d44"/><rect x="139" y="304" width="22" height="10" rx="3" fill="#6a5d44"/><rect x="172" y="304" width="22" height="10" rx="3" fill="#6a5d44"/>
    <circle cx="117" cy="345" r="6" fill="#7a2c2c"/><circle cx="183" cy="345" r="6" fill="#7a2c2c"/>
    <!-- red dragon patch -->
    <rect x="106" y="272" width="34" height="22" rx="2" fill="#8a2a26" stroke="#3b1412" stroke-width="2"/>
    <path d="M111 288 Q116 276 122 283 Q128 290 134 278" fill="none" stroke="#d8b06c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="134" cy="278" r="2" fill="#d8b06c"/>
    <!-- teal device -->
    <rect x="158" y="268" width="24" height="30" rx="4" fill="#2a2f2e" stroke="#555c5a" stroke-width="2"/>
    <rect class="dev" x="162" y="273" width="16" height="19" rx="2" fill="#3fa3a0"/>
    <!-- shoulders / arms -->
    <path d="M60 268 Q70 248 100 254 L102 300 Q78 304 62 294 Z" fill="url(#navy)"/>
    <path d="M240 268 Q230 248 200 254 L198 300 Q222 304 238 294 Z" fill="url(#navy)"/>
    <rect x="212" y="270" width="22" height="16" rx="2" fill="#8a7a58" transform="rotate(12 223 278)"/>
    <circle cx="224" cy="296" r="8" fill="#4d5560" stroke="#2a2f36" stroke-width="2"/>
    <!-- rifle -->
    <g class="gun">
      <g transform="rotate(-32 150 320)">
        <rect x="56" y="312" width="200" height="18" rx="4" fill="url(#gunm)"/>
        <rect x="256" y="316" width="44" height="10" rx="3" fill="#2a2e31"/>
        <rect x="110" y="298" width="64" height="12" rx="5" fill="#2f3438"/><circle cx="110" cy="304" r="7" fill="#1d2023"/><circle cx="174" cy="304" r="7" fill="#1d2023"/>
        <rect x="120" y="328" width="14" height="30" rx="3" fill="#25292c" transform="rotate(10 127 343)"/>
        <rect x="40" y="314" width="22" height="22" rx="4" fill="#2a2e31"/>
      </g>
    </g>
    <!-- arms holding -->
    <path d="M62 290 Q60 330 96 350 L112 334 Q86 318 92 296 Z" fill="url(#navy)"/>
    <ellipse cx="112" cy="344" rx="15" ry="12" fill="#8c7d5c"/>
    <path d="M236 290 Q244 254 222 240 L204 252 Q218 262 214 286 Z" fill="url(#navy)"/>
    <ellipse cx="210" cy="246" rx="14" ry="12" fill="#8c7d5c"/>

    <!-- HEAD -->
    <g class="head">
      <!-- neck gaiter -->
      <path d="M96 222 Q150 252 204 222 L208 262 Q150 284 92 262 Z" fill="#7e7054"/>
      <!-- face base -->
      <ellipse cx="150" cy="168" rx="92" ry="86" fill="#2a2d30"/>
      <!-- helmet -->
      <path d="M52 168 Q50 70 150 64 Q250 70 248 168 L236 172 Q232 128 150 120 Q68 128 64 172 Z" fill="url(#tan)" stroke="#4e4532" stroke-width="3"/>
      <path d="M62 150 L80 150 M220 150 L238 150" stroke="#3f382a" stroke-width="10"/>
      <rect x="48" y="140" width="22" height="46" rx="6" fill="#45403a"/><rect x="230" y="140" width="22" height="46" rx="6" fill="#45403a"/>
      <!-- flashlight -->
      <rect x="226" y="108" width="34" height="14" rx="6" fill="#2e3236"/><circle cx="260" cy="115" r="6" fill="#d8d2b8" opacity=".7"/>
      <!-- NVG mount + quad tubes -->
      <rect x="118" y="94" width="64" height="20" rx="5" fill="#3b3a35"/>
      <g fill="#8d7e5e" stroke="#4e4532" stroke-width="2.5">
        <rect x="92" y="54" width="26" height="50" rx="8" transform="rotate(-18 105 100)"/>
        <rect x="122" y="46" width="26" height="58" rx="8"/>
        <rect x="152" y="46" width="26" height="58" rx="8"/>
        <rect x="182" y="54" width="26" height="50" rx="8" transform="rotate(18 195 100)"/>
      </g>
      <g fill="#2a2a28">
        <rect x="90" y="48" width="30" height="12" rx="4" transform="rotate(-18 105 100)"/>
        <rect x="120" y="40" width="30" height="12" rx="4"/><rect x="150" y="40" width="30" height="12" rx="4"/>
        <rect x="180" y="48" width="30" height="12" rx="4" transform="rotate(18 195 100)"/>
      </g>
      <circle class="lens" cx="103" cy="58" r="6" fill="#c0364a"/>
      <circle class="lens" cx="135" cy="50" r="6" fill="#c0364a"/>
      <circle class="lens" cx="165" cy="50" r="6" fill="#c0364a"/>
      <circle class="lens" cx="197" cy="58" r="6" fill="#c0364a"/>
      <!-- goggles -->
      <path d="M62 170 Q150 140 238 170 L238 180 Q150 152 62 180 Z" fill="#1d1f21"/>
      <path d="M70 172 Q150 150 230 172 L222 212 Q150 226 78 212 Z" fill="url(#gog)" stroke="#2a1a14" stroke-width="4"/>
      <g clip-path="url(#gclip)"><rect class="glint" x="110" y="140" width="22" height="100" fill="#fff" opacity=".4" transform="skewX(-25)"/></g>
      <path d="M84 178 Q118 166 148 166" stroke="rgba(255,240,220,.35)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- respirator mask -->
      <path d="M86 214 Q150 232 214 214 L200 248 Q150 274 100 248 Z" fill="url(#mask)" stroke="#2b2f32" stroke-width="3"/>
      <path d="M150 222 L150 266 M118 232 L130 256 M182 232 L170 256" stroke="#2f3337" stroke-width="3"/>
      <path d="M128 240 L150 252 L172 240" fill="none" stroke="#83898e" stroke-width="2"/>
    </g>
  </svg>
</div>

<script>
(async function(){
  const p=new URLSearchParams(location.search);
  const mode=p.get("mode")||document.documentElement.dataset.mode||"strip";
  document.body.classList.add(mode); if(p.get("bg")) document.body.classList.add("bg");
  const W=mode==="wide"?1920:1440, H=mode==="wide"?400:480, st=document.getElementById("stage");
  const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);st.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;};
  fit(); addEventListener("resize",fit);

  // data.json (edit di GitHub) — URL param menimpa
  let D={};
  async function load(){ try{ D=await (await fetch("data.json?t="+Date.now(),{cache:"no-store"})).json(); }catch(e){} }
  await load();
  const get=k=>p.get(k)||D[k]||"";

  const name=get("name")||"DELTA FORCE", nm=document.getElementById("name");
  nm.textContent=name; nm.dataset.t=name;
  const base=mode==="wide"?96:70, lim=mode==="wide"?14:11; if(name.length>lim) nm.style.fontSize=base*lim/name.length+"px";
  document.getElementById("sub").textContent=get("sub")||"HAZARD OPS";

  // QR: ?link= / data.json link / qr.png
  const qs=mode==="wide"?190:170, q=document.getElementById("qr"), link=get("link");
  if(link && window.QRCode) new QRCode(q,{text:link,width:qs,height:qs,colorDark:"#0b0d0f",colorLight:"#aab1b6"});
  else { const img=new Image(qs,qs); img.src="qr.png?t="+Date.now(); img.style.display="block";
    img.onerror=()=>{q.innerHTML=`<div class="qph" style="width:${qs}px;height:${qs}px">PASANG<br>LINK<br>SAWERAN</div>`};
    q.appendChild(img); }

  // leaderboard
  const fmt=n=>typeof n==="number"?n.toLocaleString("id-ID"):n;
  function renderLB(){
    const list=(p.get("top")?p.get("top").split(",").map(s=>{const[a,b]=s.split(":");return{name:a,amount:+b||b}}):D.top)||[];
    const max=mode==="wide"?8:12;
    const rows=list.slice(0,max).map((r,i)=>`<div class="row top${i+1}" style="animation-delay:${i*.12}s"><span class="r">${i+1}</span><span class="n">${r.name}</span><span class="v">${fmt(r.amount)}</span></div>`).join("");
    document.getElementById("lb").innerHTML=rows||'<div class="row" style="opacity:1;animation:none;color:var(--dim)">Jadilah yang pertama!</div>';
  }
  renderLB();
  setInterval(async()=>{await load();renderLB();},60000);   // update otomatis tiap 1 menit

  for(let i=0;i<20;i++){const d=document.createElement("div");d.className="dust";
    d.style.left=Math.random()*W+"px";d.style.top=(H*.5+Math.random()*H*.5)+"px";
    d.style.animationDuration=(5+Math.random()*6)+"s";d.style.animationDelay=(-Math.random()*8)+"s";st.appendChild(d);}
})();
</script>
</body></html>
